<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar Scheduler</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 40px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2, h3 {
      text-align: center;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #calendarSection {
      display: block;
    }
    #appointmentsSection {
      display: none;
    }
    #loginSection, #signupSection {
      display: block;
    }
    #generatedPassword {
      text-align: center;
      font-weight: bold;
      color: #007BFF;
    }
    #clock {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* Dark mode styles */
    body.dark {
      background: #121212;
      color: white;
    }
    body.dark .container {
      background: #1e1e1e;
    }
    body.dark input,
    body.dark select,
    body.dark button {
      background: #2e2e2e;
      color: white;
    }
  </style>
</head>
<body>

  <button id="darkModeToggle">Toggle Dark Mode</button>

  <!-- Login Section -->
  <div class="container" id="loginSection">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="javascript:void(0)" id="signupLink">Sign Up</a></p>
  </div>

  <!-- Signup Section -->
  <div class="container" id="signupSection" style="display:none;">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required />
      <input type="password" id="signupPassword" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="javascript:void(0)" id="loginLink">Login</a></p>
  </div>

  <!-- Calendar Scheduler Section -->
  <div class="container" id="calendarSection" style="display:none;">
    <h2>Calendar Scheduler</h2>
    <div id="clock"></div>
    <button id="logoutBtn">Logout</button>

    <form id="appointmentForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="date" id="date" required />
      <input type="time" id="time" required />
      <button type="submit">Book Appointment</button>
    </form>

    <!-- Button to navigate to scheduled appointments page -->
    <button onclick="showAppointments()">View Scheduled Appointments</button>
  </div>

  <!-- Scheduled Appointments Section -->
  <div class="container" id="appointmentsSection">
    <h2>Scheduled Appointments</h2>
    
    <!-- Search Bar and Filter -->
    <input type="text" id="appointmentsSearchBar" placeholder="Search appointments" onkeyup="searchAppointments()" />
    <input type="date" id="appointmentsFilterDate" />
    <button onclick="filterAppointments()">Filter</button>
    <button onclick="showAllAppointments()">Show All</button>

    <div class="appointment-list" id="appointments"></div>
    <button onclick="showCalendar()">Back to Calendar</button>
  </div>

  <script>
    // Dark Mode Toggle
    document.getElementById('darkModeToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    // Manage user authentication
    let users = JSON.parse(localStorage.getItem('users')) || [];
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

    // If user is logged in, show the calendar section
    if (currentUser) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('calendarSection').style.display = 'block';
    }

    // Load and display the current time
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      const date = now.toLocaleDateString();
      document.getElementById('clock').textContent = `Today is ${date} | Current time: ${time}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Manage appointments (storing in localStorage)
    let bookedSlots = JSON.parse(localStorage.getItem('bookedSlots')) || [];

    // Function to display the appointments list
    function displayAppointments(appointments) {
      const appointmentList = document.getElementById('appointments');
      appointmentList.innerHTML = '';

      if (appointments.length === 0) {
        appointmentList.innerHTML = '<p>No appointments booked.</p>';
      }

      appointments.forEach(({ name, email, date, time, slotKey }) => {
        const div = document.createElement('div');
        div.className = 'appointment';
        div.innerHTML = `  
          <strong>${name}</strong> booked<br>${date} at ${time}<br><em>${email}</em>
          <button onclick="removeAppointment('${slotKey}')">Delete</button>
        `;
        appointmentList.appendChild(div);
      });
    }

    // Remove appointment
    function removeAppointment(slotKey) {
      bookedSlots = bookedSlots.filter(appointment => appointment.slotKey !== slotKey);
      localStorage.setItem('bookedSlots', JSON.stringify(bookedSlots));
      displayAppointments(bookedSlots);
    }

    // Add new appointment
    const form = document.getElementById('appointmentForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const slotKey = `${date}-${time}`;

      if (bookedSlots.find(a => a.slotKey === slotKey)) {
        alert("This time slot is already booked. Please choose another.");
        return;
      }

      // Confirmation before adding the appointment
      if (confirm(`Confirm appointment:\nName: ${name}\nEmail: ${email}\nDate: ${date}\nTime: ${time}`)) {
        const newAppointment = { name, email, date, time, slotKey };
        bookedSlots.push(newAppointment);
        localStorage.setItem('bookedSlots', JSON.stringify(bookedSlots));
        displayAppointments(bookedSlots);
        form.reset();
      }
    });

    // Filter appointments
    function filterAppointments() {
      const filterDate = document.getElementById('appointmentsFilterDate').value;
      if (!filterDate) return;
      const filtered = bookedSlots.filter(a => a.date === filterDate);
      displayAppointments(filtered);
    }

    // Show all appointments
    function showAllAppointments() {
      displayAppointments(bookedSlots);
    }

    // Search functionality
    function searchAppointments() {
      const searchQuery = document.getElementById('appointmentsSearchBar').value.toLowerCase();
      const filteredAppointments = bookedSlots.filter(a => 
        a.name.toLowerCase().includes(searchQuery) || 
        a.email.toLowerCase().includes(searchQuery)
      );
      displayAppointments(filteredAppointments);
    }

    // Check for upcoming or past appointments
    function checkDueAppointments() {
      const currentDate = new Date();
      bookedSlots.forEach(({ name, date, time, slotKey }) => {
        const appointmentDateTime = new Date(`${date}T${time}`);
        const timeDifference = appointmentDateTime - currentDate;

        // If appointment is due or within 5 minutes from now
        if (timeDifference <= 0) {
          alert(`Your appointment with ${name} is now due.`);
        } else if (timeDifference <= 5 * 60 * 1000) {  // 5 minutes before appointment
          alert(`Your appointment with ${name} is in 5 minutes.`);
        }
      });
    }

    // Check for due appointments every minute
    setInterval(checkDueAppointments, 60000); // Check every minute

    // Show Scheduled Appointments Page
    function showAppointments() {
      document.getElementById('calendarSection').style.display = 'none';
      document.getElementById('appointmentsSection').style.display = 'block';
      displayAppointments(bookedSlots);
    }

    // Back to Calendar Page
    function showCalendar() {
      document.getElementById('appointmentsSection').style.display = 'none';
      document.getElementById('calendarSection').style.display = 'block';
    }

    // Logout functionality
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', function() {
      localStorage.removeItem('currentUser');
      alert("You have logged out.");
      location.reload();
    });

    // Handle Login
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        localStorage.setItem('currentUser', JSON.stringify(user));
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('calendarSection').style.display = 'block';
      } else {
        alert("Invalid email or password.");
      }
    });

    // Handle Signup
    const signupForm = document.getElementById('signupForm');
    signupForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      if (users.find(u => u.email === email)) {
        alert("This email is already registered.");
      } else {
        const newUser = { email, password };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        alert("Signup successful! You can now login.");
        document.getElementById('signupSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
      }
    });

    // Show the Sign Up form
    document.getElementById('signupLink').addEventListener('click', () => {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('signupSection').style.display = 'block';
    });

    // Show the Login form
    document.getElementById('loginLink').addEventListener('click', () => {
      document.getElementById('signupSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'block';
    });

    // Display appointments on page load
    displayAppointments(bookedSlots);
  </script>

</body>
</html>
